<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnipType</title>
</head>
<body data-platform="windows" data-density="compact">
  <!-- Teô design system 2.7.1, native/windows/assets/icons.svg -->
  <svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
  <symbol id="library" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 4l4-1 3 16-4 1z"/></g></symbol>
  <symbol id="favorite" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></g></symbol>
  <symbol id="settings" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="var(--native-panel,Canvas)"/><circle cx="16" cy="12" r="2" fill="var(--native-panel,Canvas)"/><circle cx="10" cy="18" r="2" fill="var(--native-panel,Canvas)"/></g></symbol>
  <symbol id="plus" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 4v16M4 12h16"/></g></symbol>
  <symbol id="search" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></g></symbol>
  <symbol id="back" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><path d="m11 4-8 8 8 8M3 12h18"/></g></symbol>
  <symbol id="check" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><path d="m4 12 5 5L20 6"/></g></symbol>
  <symbol id="document" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/></g></symbol>
  <!-- App-local, drawn on the same 24px grid and stroke as the Windows family sprite above (DESIGN.md). -->
  <symbol id="mapping" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 4h9l9 9-8 8-10-10z"/><circle cx="8" cy="9" r="1.5"/></g></symbol>
  <symbol id="dynamic" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><path d="M13 3 5 13h6l-1 8 8-10h-6z"/></g></symbol>
  <symbol id="chevron-down" viewBox="0 0 20 20"><g transform="scale(0.8333333333333334)" fill="none" stroke="currentColor" stroke-width="1.7999999999999998" stroke-linecap="square" stroke-linejoin="miter"><path d="m6 9 6 6 6-6"/></g></symbol>
  </svg>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
