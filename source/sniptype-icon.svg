<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SnipType</title>
  <desc id="desc">An amber trigger dot, lines of text, and a text cursor on a rounded ink tile.</desc>

  <!-- Teô 3.2.0 ink tile, with a neutral edge for contrast on dark taskbars. -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="#0A0A0A"/>
  <rect x="76" y="76" width="872" height="872" rx="196" fill="none" stroke="#8A8A8A" stroke-width="24"/>

  <!-- Text strokes and caret. Keep the trigger dot clear of the tray badge. -->
  <path d="M384 384 H576 M228 512 H576 M228 640 H480" fill="none" stroke="#D4D4D4" stroke-width="56" stroke-linecap="round"/>
  <path d="M690 288 H814 M690 736 H814 M752 288 V736" fill="none" stroke="#F5F5F5" stroke-width="64" stroke-linecap="round"/>
  <circle cx="244" cy="384" r="60" fill="#FE9A00"/>
</svg>
