<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SnipType</title>
  <desc id="desc">A copper trigger dot expanding into lines of text beside a text cursor, on a rounded matte navy tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263C56"/>
      <stop offset="1" stop-color="#152235"/>
    </linearGradient>
  </defs>

  <!-- Tile: matte navy-500 to the slate-navy rail, with a navy-400 rim that
       keeps its edge on dark taskbars. No sheen or glow: the system is matte. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="72" y="72" width="880" height="880" rx="192" fill="none" stroke="#8CA8CF" stroke-opacity="0.45" stroke-width="16"/>

  <!-- Expansion: the snippet's lines, in navy-300. -->
  <path d="M372 384 H600 M212 512 H600 M212 640 H504" fill="none" stroke="#ADC1DC" stroke-width="56" stroke-linecap="round"/>
  <!-- Text cursor: the insertion point, flat text ink. -->
  <path d="M708 288 H812 M708 736 H812 M760 288 V736" fill="none" stroke="#F2EFE9" stroke-width="56" stroke-linecap="round"/>
  <!-- Trigger: the one copper accent, the short word the lines expand from,
       separated from the tile by a navy ring. Top left, clear of the tray's
       state badge in the bottom-right corner. -->
  <circle cx="244" cy="384" r="64" fill="#E6A05A" stroke="#152235" stroke-width="24"/>
</svg>
