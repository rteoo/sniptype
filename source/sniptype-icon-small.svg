<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SnipType</title>
  <desc id="desc">Small-size SnipType mark: a bold text cursor and an amber trigger dot on a matte ink tile.</desc>

  <!-- Drawn for 16–32 px slots: keep the cursor and dot with heavier strokes
       so the mark stays readable at tray sizes.
       Same canvas and tile placement as sniptype-icon.svg. -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="#0A0A0A"/>
  <rect x="84" y="84" width="856" height="856" rx="188" fill="none" stroke="#8A8A8A" stroke-width="40"/>
  <path d="M496 236 H720 M496 788 H720 M608 236 V788" fill="none" stroke="#F5F5F5" stroke-width="96" stroke-linecap="round"/>
  <circle cx="300" cy="332" r="96" fill="#FE9A00"/>
</svg>
