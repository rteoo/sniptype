<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">SnipType</title>
  <desc id="desc">Small-size SnipType mark: a bold text cursor and a copper trigger dot on a matte navy tile.</desc>

  <!-- Drawn for 16-24 px slots: the text lines would fall below one pixel,
       so the glyph keeps only the cursor and the dot, with heavier strokes.
       Same canvas and tile placement as sniptype-icon.svg. -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#263C56"/>
  <rect x="80" y="80" width="864" height="864" rx="184" fill="none" stroke="#8CA8CF" stroke-opacity="0.55" stroke-width="32"/>
  <path d="M496 236 H720 M496 788 H720 M608 236 V788" fill="none" stroke="#F2EFE9" stroke-width="96" stroke-linecap="round"/>
  <circle cx="300" cy="332" r="112" fill="#E6A05A" stroke="#263C56" stroke-width="36"/>
</svg>
