name: CI

on:
  # Branch-push checks attach to the exact head commit and satisfy required
  # status checks. Manual workflow_dispatch runs are useful for diagnosis but
  # GitHub intentionally excludes them from pull-request status evaluation.
  push:
  workflow_dispatch:

# A newer commit supersedes older validation for the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    # A headless Tk regression must fail boundedly instead of consuming the
    # runner's six-hour cap while orphaning xvfb/python processes.
    timeout-minutes: 10
    # Windows-first app, but the POSIX backends (clipboard, autostart,
    # single-instance lockfile) are only honestly covered if they run on a real
    # macOS/Linux host. The GUI tests self-skip where Tk has no display.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover every platform path and both supported Python lines without the
        # redundant six-way Cartesian product. Windows keeps both interpreters
        # because it is the release platform; POSIX lanes use the current one.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-release.lock

      # pynput and pystray both bind to Xorg on Linux and raise at import time
      # with no DISPLAY, and setup-python's CPython links _tkinter against the
      # system libtk8.6. Xvfb plus those libs is what makes the suite runnable.
      - name: Install Linux headless GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb tk

      - name: Install dependencies
        working-directory: source
        run: python -m pip install --require-hashes -r ../requirements-release.lock

      # The shared lock already contains the pinned dev tool. Keeping lint in
      # the Linux lane avoids another checkout, Python setup and dependency job.
      - name: Run focused lint
        if: runner.os == 'Linux'
        run: python -m ruff check source

      - name: Run test suite
        if: runner.os != 'Linux'
        working-directory: source
        run: python -m unittest discover -s tests -v

      - name: Run test suite (headless X server)
        if: runner.os == 'Linux'
        working-directory: source
        run: xvfb-run -a python -m unittest discover -s tests -v
